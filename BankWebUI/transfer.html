<!--
  transfer.html
  
  Purpose:
  Interactive Fund Transfer screen.
  Submits fund transfer instructions to /api/transfer via app.js to update both
  sender and recipient account balances in the Java backend.
  
  Target Audience: 2nd-Year Engineering Students learning Form Validation & Async Transfers.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Transfer - Apex National Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="dashboard.html" class="brand">
            🏛️ Apex National Bank
        </a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="transfer.html" class="active">Transfer Funds</a></li>
            <li><a href="#" class="logout-btn">Sign Out</a></li>
        </ul>
    </nav>

    <!-- Main Container -->
    <main class="auth-container" style="max-width: 500px;">
        <div class="card">
            <div class="card-header">
                <h2>Transfer Funds</h2>
                <p>Instantly send money to any registered bank account</p>
            </div>

            <!-- Transfer Form (Handled by app.js) -->
            <form id="transferForm">
                <!-- Sender Account (Read Only) -->
                <div class="form-group">
                    <label for="fromAccount">From Account (Source)</label>
                    <input 
                        type="text" 
                        id="fromAccount" 
                        name="fromAccount" 
                        class="form-control" 
                        value="Loading..." 
                        readonly
                    >
                </div>

                <!-- Recipient Account -->
                <div class="form-group">
                    <label for="toAccount">Beneficiary Account Number</label>
                    <input 
                        type="text" 
                        id="toAccount" 
                        name="toAccount" 
                        class="form-control" 
                        placeholder="e.g. 1002" 
                        required 
                        pattern="[0-9A-Za-z]+"
                    >
                    <p class="form-help">Enter recipient's registered account number</p>
                </div>

                <!-- Transfer Amount -->
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input 
                        type="number" 
                        id="amount" 
                        name="amount" 
                        class="form-control" 
                        placeholder="100.00" 
                        required 
                        min="0.01" 
                        step="0.01"
                    >
                </div>

                <!-- Remarks / Purpose -->
                <div class="form-group">
                    <label for="remarks">Transfer Remarks (Optional)</label>
                    <input 
                        type="text" 
                        id="remarks" 
                        name="remarks" 
                        class="form-control" 
                        placeholder="e.g. Project stipend, College fees"
                    >
                </div>

                <!-- Security PIN -->
                <div class="form-group">
                    <label for="pin">Authorize with Your Security PIN</label>
                    <input 
                        type="password" 
                        id="pin" 
                        name="pin" 
                        class="form-control" 
                        placeholder="••••" 
                        required 
                        maxlength="6" 
                        pattern="[0-9]{4,6}"
                    >
                </div>

                <!-- Action Buttons -->
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <a href="dashboard.html" class="btn btn-secondary" style="flex: 1;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Confirm Transfer</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 Apex National Bank &bull; Powered by Java Core HttpServer & Web UI
    </footer>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
