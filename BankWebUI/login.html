<!--
  login.html
  
  Purpose:
  Interactive Bank Customer Login screen.
  Submits credentials to /api/login via app.js to authenticate against the Java backend.
  
  Target Audience: 2nd-Year Engineering Students learning Web Frontend & Java Backend Integration.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apex National Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            🏛️ Apex National Bank
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Open Account</a></li>
        </ul>
    </nav>

    <!-- Main Auth Form Container -->
    <main class="auth-container">
        <div class="card">
            <div class="card-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your Apex Bank account</p>
            </div>

            <!-- Login Form (Handled by app.js) -->
            <form id="loginForm">
                <!-- Account Number Field -->
                <div class="form-group">
                    <label for="accountNumber">Account Number</label>
                    <input 
                        type="text" 
                        id="accountNumber" 
                        name="accountNumber" 
                        class="form-control" 
                        placeholder="e.g. 1001" 
                        required 
                        autocomplete="off"
                    >
                    <p class="form-help">Enter your registered account number</p>
                </div>

                <!-- PIN Field -->
                <div class="form-group">
                    <label for="pin">Security PIN</label>
                    <input 
                        type="password" 
                        id="pin" 
                        name="pin" 
                        class="form-control" 
                        placeholder="••••" 
                        required 
                        maxlength="6"
                        autocomplete="off"
                    >
                    <p class="form-help">Your 4-digit secret PIN code</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">Sign In to Account</button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html">Register here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 Apex National Bank &bull; Powered by Java Core HttpServer & Web UI
    </footer>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
